name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # CPU-only torch first: sentence-transformers would otherwise pull the
      # multi-GB CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # The sandbox tests run user code inside this image.
      - run: docker build -t code-sandbox .
      # No API keys are set here, so the tests that call the LLM skip.
      - run: pytest -q
